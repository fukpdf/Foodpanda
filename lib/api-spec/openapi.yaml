openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Public contract for the Foodpanda platform foundation.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: orders
  - name: internal
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Create an order
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /orders/me:
    get:
      operationId: getMyOrders
      tags: [orders]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Customer orders
        "401":
          $ref: "#/components/responses/Unauthorized"
  /orders/rider/me:
    get:
      operationId: getRiderOrders
      tags: [orders]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Rider orders
        "401":
          $ref: "#/components/responses/Unauthorized"
  /orders/vendor/branch/{branchId}:
    get:
      operationId: getVendorBranchOrders
      tags: [orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/BranchId"
      responses:
        "200":
          description: Vendor branch orders
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /orders/{id}:
    get:
      operationId: getOrder
      tags: [orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /orders/{id}/state:
    patch:
      operationId: transitionOrder
      tags: [orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: State transition result
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /orders/{id}/cancel:
    post:
      operationId: cancelOrder
      tags: [orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Cancellation result
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /orders/{id}/history:
    get:
      operationId: getOrderHistory
      tags: [orders]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Order history
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    BranchId:
      name: branchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 255 }
  responses:
    BadRequest:
      description: Invalid request
    Unauthorized:
      description: Authentication required
    Forbidden:
      description: Authorization denied
    NotFound:
      description: Resource not found
    Conflict:
      description: Request conflicts with current state
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
