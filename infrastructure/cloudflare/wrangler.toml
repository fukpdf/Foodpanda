name = "deliveryos-edge"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
API_GATEWAY_URL = "https://api.deliveryos.com"

[[routes]]
pattern = "deliveryos.com/*"
zone_name = "deliveryos.com"

[[routes]]
pattern = "vendor.deliveryos.com/*"
zone_name = "deliveryos.com"

[[routes]]
pattern = "rider.deliveryos.com/*"
zone_name = "deliveryos.com"

[[routes]]
pattern = "admin.deliveryos.com/*"
zone_name = "deliveryos.com"

[build]
command = "pnpm run build"

[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "placeholder_kv_namespace_id"
preview_id = "placeholder_preview_kv_namespace_id"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "deliveryos-media"

[limits]
cpu_ms = 50

[placement]
mode = "smart"
